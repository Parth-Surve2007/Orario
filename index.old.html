<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AttendEase | Smart Attendance Tracker</title>
    <meta name="description" content="Track your college attendance with ease using Excel timetables.">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#50616b">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Tailwind Config (Glacier Light) -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#fffbf0",
                        "surface-dim": "#fef3c7",
                        "surface-bright": "#fffbf0",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#fffbeb",
                        "surface-container": "#fef3c7",
                        "surface-container-high": "#fde68a",
                        "surface-container-highest": "#fcd34d",
                        "on-surface": "#431407",
                        "on-surface-variant": "#78350f",
                        "inverse-surface": "#431407",
                        "inverse-on-surface": "#fef3c7",
                        "outline": "#b45309",
                        "outline-variant": "#f59e0b",
                        "surface-tint": "#e11d48",
                        "primary": "#e11d48",
                        "on-primary": "#ffffff",
                        "primary-container": "#ffe4e6",
                        "on-primary-container": "#881337",
                        "inverse-primary": "#f43f5e",
                        "secondary": "#ca8a04",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#fef08a",
                        "on-secondary-container": "#713f12",
                        "tertiary": "#4d7c0f",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#d9f99d",
                        "on-tertiary-container": "#3f6212",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#ffdae0",
                        "primary-fixed-dim": "#f43f5e",
                        "on-primary-fixed": "#3e0013",
                        "secondary-fixed": "#fef08a",
                        "secondary-fixed-dim": "#facc15",
                        "tertiary-fixed": "#d9f99d",
                        "tertiary-fixed-dim": "#a3e635",
                        "background": "#fffbf0",
                        "on-background": "#431407",
                        "surface-variant": "#fde68a"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        full: "9999px"
                    },
                    spacing: {
                        "container-padding": "24px",
                        unit: "8px",
                        gutter: "16px",
                        "glass-padding": "20px"
                    },
                    fontFamily: {
                        sans: ["Inter", "system-ui", "sans-serif"]
                    },
                    fontSize: {
                        "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "300" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="text-on-surface min-h-screen flex flex-col">

    <!-- Blurred Image Background -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden bg-[#fffbf0] dark:bg-[#1a0f0a] transition-colors duration-500">
        <img src="bg-image.png" class="absolute inset-0 w-full h-full object-cover blur-[8px] scale-110 opacity-60 dark:opacity-40 transition-opacity duration-500" alt="">
        <div class="absolute inset-0 bg-slate-950/50 opacity-0 dark:opacity-100 transition-opacity duration-500"></div>
    </div>

    <!-- Top App Bar -->
    <header class="flex items-center justify-center px-glass-padding py-4 sticky top-0 z-40">
        <h1 class="text-4xl sm:text-5xl text-surface font-header tracking-wide drop-shadow-md">AttendEase</h1>
    </header>

    <!-- Main Content Canvas -->
    <main class="relative z-10 flex-grow pt-[80px] pb-[120px] px-gutter md:px-container-padding max-w-7xl mx-auto w-full">
        <section id="content-area" class="flex flex-col gap-gutter">
            <!-- Dynamic content injected by app.js -->
        </section>
    </main>

    <!-- Bottom Nav Bar -->
    <nav id="bottom-nav" class="glass-nav fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md rounded-[28px] z-50">
        <div class="flex justify-around items-center p-2 w-full">
            <button id="nav-dashboard" class="bottom-nav-item flex flex-col items-center justify-center px-4 py-2 rounded-full transition-all duration-200" data-view="dashboard">
                <span class="material-symbols-outlined mb-0.5">dashboard</span>
                <span class="text-label-sm">Dashboard</span>
            </button>
            <button id="nav-timetable" class="bottom-nav-item flex flex-col items-center justify-center px-4 py-2 rounded-[24px] transition-all duration-200" data-view="timetable">
                <span class="material-symbols-outlined mb-0.5">event_note</span>
                <span class="text-label-sm">Timetable</span>
            </button>
            <button id="nav-tasks" class="bottom-nav-item flex flex-col items-center justify-center px-4 py-2 rounded-[24px] transition-all duration-200" data-view="tasks">
                <span class="material-symbols-outlined mb-0.5">task_alt</span>
                <span class="text-label-sm">Tasks</span>
            </button>
            <button id="nav-statistics" class="bottom-nav-item flex flex-col items-center justify-center px-4 py-2 rounded-[24px] transition-all duration-200" data-view="statistics">
                <span class="material-symbols-outlined mb-0.5">analytics</span>
                <span class="text-label-sm">Stats</span>
            </button>
            <button id="nav-settings" class="bottom-nav-item flex flex-col items-center justify-center px-4 py-2 rounded-full transition-all duration-200" data-view="settings">
                <span class="material-symbols-outlined mb-0.5">settings</span>
                <span class="text-label-sm">Settings</span>
            </button>
        </div>
    </nav>

    <!-- Libraries -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
