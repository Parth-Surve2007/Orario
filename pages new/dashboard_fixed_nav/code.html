<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AttendEase - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#dbe4ea",
                        "surface-container-low": "#eff4ff",
                        "surface-container": "#e5eeff",
                        "surface": "#f8f9ff",
                        "primary-fixed-dim": "#b7c9d5",
                        "primary-fixed": "#d3e5f1",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-fixed-dim": "#bfc8ce",
                        "on-secondary-fixed": "#001e2b",
                        "on-tertiary-fixed-variant": "#3f484d",
                        "secondary-fixed-dim": "#7bd1fa",
                        "on-primary-fixed-variant": "#384953",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#d3e4fe",
                        "on-primary-fixed": "#0c1e26",
                        "primary-container": "#e0f2fe",
                        "surface-tint": "#50616b",
                        "on-primary": "#ffffff",
                        "primary": "#50616b",
                        "on-error": "#ffffff",
                        "on-surface": "#0b1c30",
                        "inverse-primary": "#b7c9d5",
                        "secondary-container": "#7ed4fd",
                        "tertiary-container": "#e8f1f7",
                        "surface-container-high": "#dce9ff",
                        "on-tertiary": "#ffffff",
                        "secondary": "#006686",
                        "outline": "#73787b",
                        "secondary-fixed": "#c0e8ff",
                        "on-primary-container": "#5e6f79",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "background": "#f8f9ff",
                        "on-background": "#0b1c30",
                        "on-secondary-fixed-variant": "#004d66",
                        "inverse-surface": "#213145",
                        "on-tertiary-fixed": "#141d21",
                        "surface-bright": "#f8f9ff",
                        "tertiary": "#576065",
                        "outline-variant": "#c3c7cb",
                        "surface-variant": "#d3e4fe",
                        "surface-dim": "#cbdbf5",
                        "on-surface-variant": "#43474b",
                        "on-secondary-container": "#005b78",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#656e73"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "unit": "8px",
                        "gutter": "16px",
                        "glass-padding": "20px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "300" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f8f9ff;
            background-image: 
                radial-gradient(at 40% 20%, hsla(200, 100%, 94%, 0.5) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189, 100%, 90%, 0.5) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(210, 100%, 95%, 0.5) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Glassmorphism Classes */
        .glass-base {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .glass-floating {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(186, 230, 253, 0.2);
        }

        .glass-modal {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-left: 1px solid rgba(255, 255, 255, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 40px 0 rgba(186, 230, 253, 0.3);
        }

        .glass-button-primary {
            background: linear-gradient(135deg, rgba(126, 212, 253, 0.9) 0%, rgba(126, 212, 253, 0.7) 100%);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.5), 0 4px 12px rgba(126, 212, 253, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .glass-button-primary:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), 0 6px 16px rgba(126, 212, 253, 0.4);
        }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-on-surface font-body-md min-h-screen flex flex-col pt-20 pb-28 md:pb-8">
<!-- TopAppBar -->
<header class="bg-white/10 dark:bg-black/10 backdrop-blur-lg fixed top-0 w-full z-50 border-b border-white/20 dark:border-white/10 shadow-[0_8px_32px_0_rgba(186,230,253,0.2)]">
<div class="flex justify-between items-center px-container-padding py-4 w-full max-w-7xl mx-auto">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-white/20 transition-all duration-300 p-2 rounded-full active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-light tracking-tight text-primary dark:text-primary-fixed-dim">AttendEase</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-white/20 transition-all duration-300 p-2 rounded-full active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col w-full max-w-7xl mx-auto px-container-padding md:px-6">
<!-- Welcome Setup Card (Empty State) -->
<section class="mt-8 mb-12 flex justify-center w-full">
<div class="glass-modal rounded-xl p-8 md:p-12 w-full max-w-2xl text-center flex flex-col items-center gap-6 relative overflow-hidden group">
<!-- Decorative blurred shapes behind card content -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-secondary-container/40 rounded-full blur-2xl"></div>
<div class="absolute -bottom-10 -left-10 w-32 h-32 bg-primary-container/40 rounded-full blur-2xl"></div>
<div class="z-10 bg-white/30 p-6 rounded-full shadow-[0_4px_16px_rgba(186,230,253,0.2)] mb-2 border border-white/40">
<span class="material-symbols-outlined text-display-lg text-secondary" style="font-variation-settings: 'FILL' 1;">waving_hand</span>
</div>
<div class="z-10 flex flex-col gap-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface font-medium">Welcome to AttendEase</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mx-auto">Please upload your timetable and select your class to get started.</p>
</div>
<button class="z-10 glass-button-primary text-on-secondary font-label-sm text-label-sm uppercase tracking-wider px-8 py-4 rounded-full mt-4 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">upload_file</span>
                    Setup Now
                </button>
</div>
</section>
<!-- Reference Image Section (Bento Grid approach for future content) -->
</main>
<!-- BottomNavBar (Mobile Only based on intent, but rendered as requested for Dashboard destination) -->
<!-- Applying md:hidden to strictly follow "Responsive Pivot" rule from Shared Components Logic -->
<nav class="md:hidden bg-zinc-900/80 backdrop-blur-xl fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] rounded-full z-50 border border-white/10 shadow-2xl"><ul class="flex justify-around items-center p-2 w-full text-white">
<li class="relative">
<button class="flex flex-col items-center justify-center px-4 py-2 transition-all duration-200">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-sm text-label-sm mt-1 text-white">Dashboard</span>
<div class="absolute -bottom-1 w-1 h-1 bg-pink-400 rounded-full"></div>
</button>
</li>
<li>
<button class="flex flex-col items-center justify-center text-white/70 px-4 py-2 hover:text-white transition-all">
<span class="material-symbols-outlined">event_note</span>
<span class="font-label-sm text-label-sm mt-1">Timetable</span>
</button>
</li>
<li>
<button class="flex flex-col items-center justify-center text-white/70 px-4 py-2 hover:text-white transition-all">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-sm text-label-sm mt-1">Stats</span>
</button>
</li>
<li>
<button class="flex flex-col items-center justify-center text-white/70 px-4 py-2 hover:text-white transition-all">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm mt-1">Settings</span>
</button>
</li>
</ul></nav>
</body></html>
